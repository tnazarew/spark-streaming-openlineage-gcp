plugins {
    id 'java'
    id 'scala'
    id 'com.google.protobuf' version '0.9.4'
    id 'com.github.davidmc24.gradle.plugin.avro' version '1.9.1'
}

group = 'io.openlineage'
version = '1.0-SNAPSHOT'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url "https://packages.confluent.io/maven/"
    }
}

// Configure Scala plugin to use compatible Zinc compiler
scala {
    zincVersion = "1.9.6"
}

configurations {
    all {
        resolutionStrategy {
            force 'org.scala-lang:scala-library:2.12.17'
            force 'org.scala-lang:scala-reflect:2.12.17'
            // Force Jackson versions to match Spark 3.5.1 exactly
            force 'com.fasterxml.jackson.core:jackson-core:2.15.2'
            force 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
            force 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'
            force 'com.fasterxml.jackson.module:jackson-module-scala_2.12:2.15.2'
            force 'com.fasterxml.jackson.module:jackson-module-blackbird:2.15.2'
            // Force consistent OpenLineage versions
            force 'io.openlineage:openlineage-spark_2.12:1.38.0-SNAPSHOT'
        }
        // Exclude conflicting transitive dependencies
        exclude group: 'io.openlineage.spark.shaded.com.fasterxml.jackson.core'
        exclude group: 'io.openlineage.spark.shaded.com.fasterxml.jackson.module'
    }
}

dependencies {
    // Spark - including Kafka integration
    implementation 'org.apache.spark:spark-core_2.12:3.5.1'
    implementation 'org.apache.spark:spark-streaming_2.12:3.5.1'
    implementation 'org.apache.spark:spark-sql_2.12:3.5.1'
    implementation 'org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1'  // Added Kafka integration
    implementation 'org.apache.spark:spark-streaming-kafka-0-10_2.12:3.5.1'  // Added Kafka streaming

    // Scala - use exact same versions as Spark dependencies
    implementation 'org.scala-lang:scala-library:2.12.17'
    implementation 'org.scala-lang:scala-reflect:2.12.17'
    implementation 'org.scala-lang:scala-compiler:2.12.17'

    // Jackson - use the exact version that Spark 3.5.1 uses
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'
    implementation 'com.fasterxml.jackson.module:jackson-module-scala_2.12:2.15.2'
    implementation 'com.fasterxml.jackson.module:jackson-module-blackbird:2.15.2'

    // OpenLineage - main library and Spark integration
    implementation('io.openlineage:openlineage-spark_2.12:1.38.0-SNAPSHOT') {
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'com.fasterxml.jackson.module'
    }

    implementation('io.openlineage:transports-gcplineage:1.38.0-SNAPSHOT')

    // Kafka with all required dependencies for embedded testing
    implementation 'org.apache.kafka:kafka-clients:3.7.0'
    testImplementation 'org.apache.kafka:kafka_2.12:3.7.0'
    testImplementation 'org.apache.kafka:kafka_2.12:3.7.0:test'
    testImplementation('org.springframework.kafka:spring-kafka-test:2.8.9') {
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'com.fasterxml.jackson.module'
    }
    // Use Testcontainers for Kafka instead of Spring's embedded broker
    testImplementation 'org.testcontainers:kafka:1.19.0'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.0'

    // PostgreSQL and Testcontainers for database testing
    testImplementation 'org.testcontainers:postgresql:1.19.0'
    implementation 'org.postgresql:postgresql:42.6.0'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.12'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.12'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.2.0'

    // Derby for embedded metastore - use Java 8 compatible version
    implementation 'org.apache.derby:derby:10.14.2.0'
    implementation 'org.apache.derby:derbytools:10.14.2.0'

    // Hive dependencies for catalog implementation
    implementation 'org.apache.spark:spark-hive_2.12:3.5.1'
    implementation 'org.apache.hadoop:hadoop-client:3.3.4'

    // Avro dependencies
    implementation 'org.apache.avro:avro:1.11.3'
    implementation 'io.confluent:kafka-avro-serializer:7.4.0'

    // Schema Registry dependencies
    implementation ('io.confluent:kafka-schema-registry-client:7.4.0') {
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'com.fasterxml.jackson.module'
    }
    testImplementation ('io.confluent:kafka-schema-registry:7.4.0'){
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'com.fasterxml.jackson.module'
    }
    testImplementation ('io.confluent:kafka-schema-registry:7.4.0:tests'){
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'com.fasterxml.jackson.module'
    }

    // Spark Protobuf connector for built-in protobuf functions
    implementation 'org.apache.spark:spark-protobuf_2.12:3.5.1'
}

// Configure protobuf plugin
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.24.4"
    }
    generateProtoTasks {
        all()*.plugins {
            // Apply the "grpc" plugin whose spec is defined above, without options.
            // Note the braces cannot be omitted, otherwise the plugin will not be added. This is because of the implicit way NamedDomainObjectContainer binds the methods.
        }
    }
}

// Configure Avro plugin
avro {
    // Specify the version of Avro to use
    sourceCompatibility = '1.11.3'
    targetCompatibility = '1.11.3'
}

// Add generated sources to source sets
sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/java'
            srcDirs 'build/generated-sources/avro'
        }
    }
}

test {
    useJUnitPlatform()
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}
